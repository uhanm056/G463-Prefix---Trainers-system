<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tréninkové karty – G463 Prefix · Yanfeng Planá</title>
<meta name="description" content="Tréninkové karty operátorů linky G463 Prefix: skilly po procesech, zaškolení, skill matrix a aktivita trenérů.">
<meta name="theme-color" content="#002B5C">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Vzhled podle aplikace Řízení závodu (PMS beta): navy hlavička s cestou, menu vlevo, záhlaví s fotkou, dlaždice a karty s navy hlavičkou. */
:root{--navy:#003B7A;--navy-d:#002B5C;--blue:#0A5FB4;--bg:#F3F5F8;--card:#fff;--txt:#1f2933;--muted:#6b7684;--line:#e3e8ed;
  --red:#E03C31;--amber:#E89818;--amber-t:#a96b00;--green:#1E9E4A;--grey:#9aa6b2;--th:#e8f0fa;--soft:#f6f8fb;--hov:#f1f4f8;--sq:#e6ebf0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E141C;--card:#161E29;--txt:#E6ECF2;--muted:#93A1B1;--line:#263241;--th:#1E2A3A;--soft:#1B2533;--hov:#1B2533;--sq:#263241}}
:root[data-theme="dark"]{--bg:#0E141C;--card:#161E29;--txt:#E6ECF2;--muted:#93A1B1;--line:#263241;--th:#1E2A3A;--soft:#1B2533;--hov:#1B2533;--sq:#263241}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
a{color:var(--blue)} button,input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)}.small{font-size:12px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* hlavička */
header.top{height:56px;background:linear-gradient(90deg,var(--navy-d),var(--navy) 55%,var(--blue));color:#fff;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:3px solid var(--blue);position:sticky;top:0;z-index:40}
.logo{background:#fff;border-radius:6px;padding:4px 9px;text-decoration:none;display:inline-flex;align-items:center;flex:none}
.logo img{height:20px;display:block}
.burger{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:8px;width:36px;height:34px;font-size:17px;line-height:1;cursor:pointer;flex:none}
.burger:hover{background:rgba(255,255,255,.24)}
.plant{flex:none}.plant b{display:block;font-size:12px;letter-spacing:2px}.plant small{font-size:10px;opacity:.8;letter-spacing:.8px}
.crumb{border-left:1px solid rgba(255,255,255,.25);padding-left:14px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden}
.crumb a{color:#cfe0f5;font-weight:600;text-decoration:none}.crumb a:hover{color:#fff}.crumb i{font-style:normal;opacity:.6}
.crumb .back{background:rgba(255,255,255,.14);border-radius:6px;padding:1px 8px;color:#fff}
.crumb span{overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.qs{position:relative;flex:none}
.qs input{width:230px;border:0;border-radius:999px;padding:7px 14px;background:rgba(255,255,255,.95);color:#1f2933;font-size:13px}
.dd{position:fixed;width:320px;max-height:60vh;overflow:auto;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.2);z-index:60;display:none}
.dd.open{display:block}
.dd a{display:flex;align-items:center;gap:9px;padding:8px 12px;cursor:pointer;text-decoration:none;color:var(--txt);font-size:13px}
.dd a>span{flex:1;min-width:0}.dd a small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd a.hi,.dd a:hover{background:var(--th)} .dd .none{padding:10px 12px;color:var(--muted)}
.who{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:999px;padding:5px 12px;font-size:12px;white-space:nowrap;cursor:pointer;flex:none}
.who:hover{background:rgba(255,255,255,.26)}
.sync{display:inline-flex;align-items:center;gap:6px}.sync i{width:8px;height:8px;border-radius:50%;background:#F2B544;display:inline-block}.sync.on i{background:#4ADE80}

/* menu */
.body{display:flex;min-height:calc(100vh - 59px)}
nav.side{width:224px;background:var(--card);border-right:1px solid var(--line);padding:12px 8px;flex:none;position:sticky;top:59px;align-self:flex-start;height:calc(100vh - 59px);overflow:auto}
nav.side .g{font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:14px 10px 6px}
nav.side .g:first-child{margin-top:4px}
nav.side a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;color:var(--txt);font-weight:600;text-decoration:none;min-height:38px}
nav.side a:hover{background:var(--hov)}
nav.side a .ic{width:20px;text-align:center;font-size:15px;line-height:1;flex:none}
nav.side a .cnt{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted)}
nav.side a.on{background:var(--navy);color:#fff} nav.side a.on .cnt{color:#cfe0f5}
nav.side .foot{margin:16px 10px 0;padding-top:10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.body.nonav nav.side{display:none}
.navshade{display:none}
main{flex:1;padding:14px 20px 40px;min-width:0}

/* záhlaví s fotkou */
.hero{position:relative;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;min-height:112px;padding:20px 24px 16px;margin:0 0 14px;border-radius:14px;color:#fff;overflow:hidden;
  background:linear-gradient(90deg,rgba(0,43,92,.97) 0%,rgba(0,59,122,.88) 34%,rgba(0,59,122,.48) 62%,rgba(10,95,180,.12) 100%),var(--ph) var(--pp,center)/cover no-repeat;
  box-shadow:0 6px 20px rgba(0,43,92,.16);text-shadow:0 1px 2px rgba(0,0,0,.35)}
.hero.big{min-height:170px;padding:30px 28px 22px}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--hc,linear-gradient(90deg,#78BE20,#0A5FB4))}
.hero h1{margin:0;font-size:24px;font-weight:800;letter-spacing:.2px;display:flex;align-items:center;gap:10px}
.hero.big h1{font-size:30px}
.hero p{margin:4px 0 0;font-size:13px;color:rgba(255,255,255,.88)}
.hero .hr{margin-left:auto;text-shadow:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hero .k{font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.85;font-weight:700;margin-bottom:4px}

/* dlaždice KPI */
.tks{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px}
.tk{background:var(--card);border-radius:12px;padding:12px 14px 10px;box-shadow:0 1px 3px rgba(16,32,48,.08);border-top:4px solid var(--grey);display:flex;flex-direction:column;gap:2px;min-width:0;text-decoration:none;color:inherit}
a.tk:hover{box-shadow:0 4px 12px rgba(16,32,48,.14)}
.tk.g{border-top-color:var(--green)}.tk.r{border-top-color:var(--red)}.tk.a{border-top-color:var(--amber)}.tk.b{border-top-color:var(--blue)}.tk.n{border-top-color:var(--navy)}
.tk .l{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700}
.tk .vv b{font-size:30px;font-weight:800;color:var(--navy);line-height:1.1}.tk .vv span{font-size:14px;color:var(--muted);font-weight:700;margin-left:3px}
.tk.g .vv b{color:var(--green)}.tk.r .vv b{color:var(--red)}.tk.a .vv b{color:var(--amber-t)}
.tk .s{font-size:11.5px;color:var(--muted);min-height:16px}

/* karty */
.grid{display:grid;gap:12px;margin-bottom:12px;align-items:start}.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}.g11{grid-template-columns:1fr 1fr}
.card{background:var(--card);border-radius:10px;box-shadow:0 1px 3px rgba(16,32,48,.08);overflow:hidden;margin-bottom:12px}
.grid>.card,.grid>div>.card:last-child{margin-bottom:0}
.card h3{margin:0;padding:9px 13px;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:#fff;background:linear-gradient(90deg,var(--navy-d),var(--navy));display:flex;gap:10px;align-items:center}
.card h3 span{margin-left:auto;opacity:.85;font-weight:600;text-transform:none;letter-spacing:0}
.card h3 a{color:#cfe0f5;text-transform:none;letter-spacing:0;font-weight:600;text-decoration:none}.card h3 a:hover{color:#fff}
.card .in{padding:12px 14px}
.foot{padding:8px 13px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);background:var(--soft)}
.tw{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--navy);background:var(--th);text-align:left;padding:7px 9px;font-weight:700;white-space:nowrap;position:sticky;top:0;z-index:1}
td{padding:7px 9px;border-top:1px solid var(--line);white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--hov)}
.btn{font-size:12px;font-weight:700;color:var(--blue);border:1px solid var(--blue);border-radius:999px;padding:5px 12px;white-space:nowrap;background:var(--card);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px;min-height:32px}
.btn:hover{background:var(--th)}
.btn.f{background:var(--blue);color:#fff}.btn.f:hover{background:#0b52a0}
.btn.w{background:rgba(255,255,255,.95);color:var(--navy);border-color:transparent}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.45;cursor:default}
.pill{font-size:10.5px;font-weight:800;letter-spacing:.3px;border-radius:999px;padding:2px 9px;background:#eef1f4;color:#7d8a97;white-space:nowrap}
.pill.g{background:#eaf7ee;color:var(--green)}.pill.r{background:#fdecea;color:var(--red)}.pill.b{background:#e8f0fa;color:var(--blue)}
.plan{display:inline-block;font-size:10.5px;font-weight:600;background:var(--th);color:var(--navy);border-radius:999px;padding:1px 8px}
input[type=text],input[type=date],input[type=search],input[type=number],select,textarea{background:var(--card);border:1px solid #c3ced8;border-radius:8px;padding:7px 10px;min-height:36px}
textarea{width:100%;min-height:70px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
label.f input,label.f select,label.f textarea{text-transform:none;letter-spacing:0;font-weight:400;font-size:13.5px;color:var(--txt)}
.subt{display:flex;gap:6px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.subt a,.subt button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-weight:600;color:var(--muted);text-decoration:none;font-size:12.5px;cursor:pointer}
.subt a.on,.subt button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tools input[type=search]{flex:1;min-width:200px}
.az{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:10px}
.az button{border:0;cursor:pointer;min-width:26px;height:26px;padding:0 4px;border-radius:6px;font-size:12px;font-weight:700;color:var(--blue);background:var(--th)}
.az button:hover{background:var(--blue);color:#fff}.az button:disabled{color:var(--muted);background:transparent;cursor:default;opacity:.45}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}.empty b{display:block;color:var(--navy);font-size:15px;margin-bottom:4px}

/* avatar, prstenec, pruhy */
.av{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12.5px;flex:none;letter-spacing:.3px}
.av.lg{width:64px;height:64px;font-size:22px;box-shadow:0 0 0 3px rgba(255,255,255,.6)}
.ring .rt{font-weight:800;fill:var(--navy)}.ring .rs{font-size:9px;fill:var(--muted);font-weight:700}
.hero .ring .rt{fill:#fff}.hero .ring .rs{fill:rgba(255,255,255,.85)}
.mb{display:flex;align-items:center;gap:6px;min-width:90px}.mb .tr{flex:1;height:7px;border-radius:9px;background:var(--sq);overflow:hidden}.mb .tr i{display:block;height:100%;border-radius:9px}.mb span{font-size:11.5px;width:34px;text-align:right;font-variant-numeric:tabular-nums}
.st{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:700;white-space:nowrap}
.st.new{background:#eef1f4;color:#5b6876}.st.tr{background:#fdf4e3;color:var(--amber-t)}.st.ok{background:#eaf7ee;color:var(--green)}

/* karty operátorů (mřížka) */
.opgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.opc{background:var(--card);border-radius:12px;box-shadow:0 1px 3px rgba(16,32,48,.08);padding:12px 14px;border-left:5px solid var(--sc,var(--grey));cursor:pointer;transition:box-shadow .15s,transform .15s}
.opc:hover{box-shadow:0 6px 18px rgba(16,32,48,.14);transform:translateY(-1px)}
.opc .h{display:flex;gap:10px;align-items:center}.opc .n{flex:1;min-width:0}.opc .n b{font-size:15px;color:var(--navy);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opc .n small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opc .ps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}
.opc .ps div{display:flex;flex-direction:column;gap:3px;font-size:10px;color:var(--muted);text-align:center}
.opc .ps i{display:block;height:6px;border-radius:4px;background:var(--sq);overflow:hidden}.opc .ps i u{display:block;height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .opc .n b,:root:not([data-theme="light"]) .tk .vv b{color:#9CC3F0}:root:not([data-theme="light"]) .ring .rt{fill:#9CC3F0}}

/* detail operátora */
.procs{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.proc{background:var(--card);border-radius:12px;box-shadow:0 1px 3px rgba(16,32,48,.08);overflow:hidden}
.proc .pt{display:flex;align-items:center;gap:10px;padding:10px 14px;color:#fff;background:var(--pc)}
.proc .pt .ic{font-size:18px;width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center}
.proc .pt b{font-size:14.5px;flex:1}.proc .pt .pc{font-size:20px;font-weight:800}
.proc .pbar{height:5px;background:color-mix(in srgb,var(--pc) 25%,#fff)}.proc .pbar i{display:block;height:100%;background:var(--pc)}
.step{display:flex;align-items:center;gap:10px;padding:7px 14px;border-top:1px solid var(--line)}
.step .sn{flex:1;min-width:0}.step .sn div{font-weight:600;font-size:13px}.step .sn small{display:block;color:var(--muted);font-size:11px}
.sqs{display:flex;gap:4px}
.sq{border:0;cursor:pointer;width:28px;height:28px;border-radius:7px;background:var(--sq);font-size:11px;font-weight:800;color:var(--muted);transition:transform .1s}
.sq:hover{transform:scale(1.1);box-shadow:0 0 0 2px var(--blue)} .sq.on{color:#fff}
.sgh{padding:6px 14px 4px;font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--pc);background:color-mix(in srgb,var(--pc) 9%,var(--card));border-top:1px solid var(--line)}
/* Operátoři: seznam vlevo (vlastní posuv) + karta vpravo */
.md{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;align-items:start}
.mdl{position:sticky;top:73px;margin:0;display:flex;flex-direction:column;height:calc(100vh - 87px)}
.mdh{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.mdh input[type=search]{width:100%}
.mdf{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}.mdf select{min-height:30px;padding:3px 4px;font-size:11.5px;min-width:0;width:100%}
.mdl .az{padding:6px 8px 4px;margin:0;gap:2px;border-bottom:1px solid var(--line)}.mdl .az button{min-width:19px;height:22px;font-size:11px;padding:0 3px}
.mdlist{flex:1;overflow:auto;padding:2px 0}
.mi{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 10px 6px 8px;cursor:pointer;text-decoration:none;color:inherit;border-left:3px solid transparent}
.mi:hover{background:var(--hov)}.mi.on{background:var(--th);border-left-color:var(--blue)}
.mi .av{width:30px;height:30px;font-size:11px}
.mi b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mi small{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .st{font-size:11px;padding:2px 8px}
.mdfoot{border-top:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:var(--muted)}
.mdfoot form{display:flex;gap:4px}.mdfoot input{flex:1;min-width:0;min-height:30px}
.mback{display:none}
@media (max-width:900px){.md{grid-template-columns:1fr}.md.has-sel .mdl{display:none}.md:not(.has-sel) .mdr{display:none}.mdl{position:static;height:auto}.mback{display:inline-flex}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:2px 0 12px}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:13px;height:13px;border-radius:4px;display:inline-block}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hist td{white-space:normal}

/* grafy */
.chart{padding:10px 12px 6px}.chart svg{width:100%;display:block}.chart .ax,.ax{font-size:10.5px;fill:var(--muted)}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--muted);padding:2px 14px 10px}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.donut{display:flex;align-items:center;gap:16px;padding:14px}.donut .dc{font-size:28px;font-weight:800;fill:var(--navy)}.donut .ds{font-size:11px;fill:var(--muted)}
.donut .dl{flex:1;display:flex;flex-direction:column;gap:7px;font-size:12.5px}.donut .dl div{display:grid;grid-template-columns:12px 1fr auto 40px;gap:8px;align-items:center}.donut .dl i{width:12px;height:12px;border-radius:4px}.donut .dl small{color:var(--muted);text-align:right}
.hbars{display:flex;flex-direction:column;gap:9px;padding:12px 14px}.hbars .hr{display:grid;grid-template-columns:170px 1fr 70px;gap:10px;align-items:center;text-decoration:none;color:inherit}
.hbars a.hr:hover .hl b{color:var(--blue)}
.hbars .hl small{display:block;color:var(--muted);font-size:11px}.hbars .hb{display:flex;height:20px;background:var(--soft);border-radius:6px;overflow:hidden}
.hbars .hb i{display:block;height:100%;color:#fff;font-size:11px;font-weight:800;font-style:normal;text-align:center;line-height:20px;overflow:hidden}.hbars .hn{text-align:right;color:var(--navy);font-weight:700;font-size:12.5px}
.todo{display:flex;flex-direction:column;gap:6px;padding:10px 14px}.todo a{display:block;padding:8px 10px;border-radius:8px;border-left:4px solid var(--grey);background:var(--soft);text-decoration:none;color:var(--txt)}
.todo a.r{border-color:var(--red);background:#fdf0ef}.todo a.a{border-color:var(--amber);background:#fdf6e9}.todo a.g{border-color:var(--green);background:#edf8f1}.todo small{display:block;color:var(--muted)}
.rank{padding:8px 14px 12px;display:flex;flex-direction:column;gap:4px}.rank a{display:grid;grid-template-columns:34px 1fr 140px 52px;gap:10px;align-items:center;text-decoration:none;color:inherit;padding:3px 4px;border-radius:8px}
.rank a:hover{background:var(--hov)}.rank small{display:block;color:var(--muted);font-size:11px}

/* skill matrix */
.mx td,.mx th{text-align:center;padding:4px 6px;border:1px solid var(--line)}
.mx th.op,.mx td.op{text-align:left;position:sticky;left:0;background:var(--card);z-index:2;min-width:200px}.mx th.op{background:var(--th);z-index:3}
.mx th.vs{height:140px;vertical-align:bottom;font-weight:600;text-transform:none;letter-spacing:0;font-size:11px}.mx th.vs span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}
.mx td.c{min-width:46px;font-weight:800;font-size:11.5px;cursor:pointer}
.mx td.c.k{min-width:30px;height:28px;padding:0}

<script>
/* ===================== 1. Konstanty ===================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAz7_9ijMC38SL9dVbYdjwvBHHNyuV97VU",
  authDomain: "g463-prefix---trainers-system.firebaseapp.com",
  databaseURL: "https://g463-prefix---trainers-system-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "g463-prefix---trainers-system",
  storageBucket: "g463-prefix---trainers-system.firebasestorage.app",
  messagingSenderId: "906392970022",
  appId: "1:906392970022:web:cd403e27e375d83675d7e7"
};
const ROOT = 'trenerG463/karty';
const LS_DATA = 'trenerG463.karty.v1', LS_ME = 'trenerG463.karty.me', LS_NAV = 'trenerG463.karty.nav', LS_THEME = 'trenerG463.theme';
const LEVELS = ['Nehodnoceno','Teorie / viděl','Pod vedením trenéra','Samostatně pod dohledem','Schváleno, plně zaškolen'];
const LV_COL = ['var(--sq)','#9DB4CC','#F2B544','#3B8FE0','#1E9E4A'];
const PHOTO = { plant:'assets/plant.jpg', interior:'assets/interior.jpg', car:'assets/car.jpg' };
const DEFAULT_CFG = { thNew:5, thOk:85, stale:30 };
/* Kroky podle zadání linky (Milan 16. 11.); „FRT|…“ / „RR|…“ = část dílu. Rework zatím návrh – k doplnění. */
const DEFAULT_PROCS = [
  {k:'spacer', n:'Spacer', ico:'🧩', col:'#6B4FB8', steps:['FRT|Prefix spaceru A – přes plast (busbar)','FRT|Prefix spaceru A – přes plast (window switch)','FRT|Prefix spaceru A – správné usazení kabelu','FRT|Prefix spaceru armrest','FRT|Prefix repráku','RR|Prefix spaceru A – přes plast (window switch)','RR|Prefix armrest']},
  {k:'glue', n:'Glue spray', ico:'🧴', col:'#D08600', steps:['Montáž konektoru + nalepení kabelu','Správné očištění lepidla / nástroje (toolu)','Vyhodnocení nánosu lepidla']},
  {k:'prefix', n:'Prefix', ico:'📐', col:'#0A5FB4', steps:['FRT|Očištění MC od lepidla','FRT|Správný prefix kanálu','FRT|Správný prefix trojúhelníkové zóny','FRT|Prefix kanálů po obvodu','FRT|Kontrola po prefixu – lepidlo','FRT|Prefix rohu','RR|Očištění MC od lepidla','RR|Správný prefix kanálu','RR|Kontrola po prefixu – lepidlo','RR|Prefix kanálů po obvodu']},
  {k:'lam', n:'Lamination', ico:'🔥', col:'#E03C31', steps:['Nástřih v oblasti A zóna','Příprava oblasti map pocket','Ostatní nástřihy','Kontrola správné prefixace dílů','Laminace map pocket']},
  {k:'ew', n:'Edge Wrapping', ico:'🎁', col:'#0F9488', steps:['Zahranování rohů','Zahranování rádiusu','Laminace kanálu do 1 mm','Nástřihy WS','Zatřižení přebývající kůže']},
  {k:'rework', n:'Rework', ico:'🛠️', col:'#5B6B7C', steps:['Identifikace a třídění vad','Znalost limitních vzorků','Oprava vrásek a bublin','Oprava zahranění','Odstranění znečištění lepidlem','Výstupní kontrola po opravě','Evidence opravených dílů','Rozhodnutí OK / šrot']},
];
const defaultProcs = () => DEFAULT_PROCS.map(p => ({k:p.k, n:p.n, ico:p.ico, col:p.col, steps:p.steps.map((s,i) => { const [g, n] = s.includes('|') ? s.split('|') : ['', s]; return {id:p.k+'_v2_'+(i+1), n, ...(g ? {g} : {})}; })}));
/* krok s částí dílu: „FRT · Prefix rohu“ */
const sLabel = s => (s.g ? s.g + ' · ' : '') + s.n;

/* ===================== 2. Pomocné ===================== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const today = () => new Date().toISOString().slice(0,10);
const dfmt = d => { if (!d) return ''; const [y,m,dd] = String(d).slice(0,10).split('-'); return `${+dd}. ${+m}. ${y}`; };
const dshort = d => { if (!d) return ''; const [,m,dd] = String(d).slice(0,10).split('-'); return `${+dd}. ${+m}.`; };
const daysAgo = iso => iso ? Math.floor((Date.now() - new Date(iso).getTime()) / 864e5) : null;
const clean = o => JSON.parse(JSON.stringify(o));
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 3200); }
const AV_COLS = ['#0A5FB4','#6B4FB8','#1E9E4A','#C07F00','#E03C31','#0F9488','#B4447A','#5B6B7C','#003B7A'];
const initials = n => { const w = String(n||'?').trim().split(/\s+/); return ((w[0]||'?')[0] + (w[1] ? w[1][0] : '')).toUpperCase(); };
const avatar = (n, cls='') => `<span class="av ${cls}" style="background:${AV_COLS[[...norm(n)].reduce((a,c) => a + c.charCodeAt(0), 0) % AV_COLS.length]}">${esc(initials(n))}</span>`;
const firstLetter = n => { const t = String(n || '').trim(); return /^ch/i.test(t) ? 'Ch' : (t[0] || '?').toUpperCase(); };
const AZ = ['A','B','C','Č','D','E','F','G','H','Ch','I','J','K','L','M','N','O','P','R','Ř','S','Š','T','U','V','W','Y','Z','Ž'];

/* ===================== 3. Data a úložiště (odstíněné) ===================== */
let D = { ops:{}, procs:defaultProcs(), log:{}, cfg:{} };
let fb = null, canWrite = true, online = false;
let ME = ''; try{ ME = localStorage.getItem(LS_ME) || ''; }catch(e){}
const CFG = () => ({...DEFAULT_CFG, ...(D.cfg || {})});
const fixProcs = p => Array.isArray(p) && p.length ? p.map(x => ({...x, steps: x.steps || []})) : null;
function saveLocal(){ try{ localStorage.setItem(LS_DATA, JSON.stringify(D)); }catch(e){} }
function loadLocal(){ try{ const d = JSON.parse(localStorage.getItem(LS_DATA) || 'null'); if (d){ D.ops = d.ops || {}; D.procs = fixProcs(d.procs) || D.procs; D.log = d.log || {}; D.cfg = d.cfg || {}; } }catch(e){} }
/* zápis více cest najednou (update); lokální kopie vždy */
async function write(updates){
  saveLocal();
  if (!fb) return;
  const u = {}; for (const [k,v] of Object.entries(updates)) u[k] = v == null ? null : clean(v);
  try{ await fb.ref(ROOT).update(u); }
  catch(e){ console.warn(e); canWrite = false; render(); toast('Uložení do databáze selhalo – změna je jen v tomto prohlížeči'); }
}
const newKey = () => fb ? fb.ref(ROOT + '/log').push().key : uid();
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error(src)); document.head.appendChild(s); }); }
async function fbInit(){
  await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
  await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js');
  await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js');
  firebase.initializeApp(FIREBASE_CONFIG);
  await firebase.auth().signInAnonymously();
  fb = firebase.database();
  fb.ref('.info/connected').on('value', s => { online = !!s.val(); setSync(); renderNav(); });
  const procs = (await fb.ref(ROOT + '/procs').once('value')).val();
  if (!fixProcs(procs)) await fb.ref(ROOT + '/procs').set(clean(D.procs)).catch(() => { canWrite = false; });
  const on = (path, key, fn = v => v || {}) => fb.ref(ROOT + '/' + path).on('value', s => { D[key] = fn(s.val()); saveLocal(); scheduleRender(); }, e => { console.warn(e); canWrite = false; scheduleRender(); });
  on('ops', 'ops'); on('cfg', 'cfg'); on('procs', 'procs', v => fixProcs(v) || D.procs);
  fb.ref(ROOT + '/log').orderByKey().limitToLast(4000).on('value', s => { D.log = s.val() || {}; saveLocal(); scheduleRender(); });
}
function setSync(){ $('sync').classList.toggle('on', !!fb && online); $('who').title = (fb ? (online ? 'Online – sdílená data týmu' : 'Offline – změny se odešlou po připojení') : 'Offline – data jen v tomto prohlížeči') + '. Klikněte pro změnu jména, které se ukládá ke změnám.'; }
/* nepřekreslovat pod rukama, když uživatel píše do pole */
let pending = false;
function scheduleRender(){ const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && $('main').contains(a)){ pending = true; return; } render(); }
document.addEventListener('focusout', () => setTimeout(() => { if (!pending) return; const a = document.activeElement; if (!(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && $('main').contains(a))){ pending = false; render(); } }, 60));

/* ===================== 4. Výpočty (čisté funkce) ===================== */
const allSteps = () => D.procs.flatMap(p => p.steps.map(s => ({...s, p})));
const lvOf = (o, sid) => +(o?.lv?.[sid]?.l || 0);
const procPct = (o, p) => p.steps.length ? Math.round(100 * p.steps.reduce((a,s) => a + lvOf(o, s.id), 0) / (4 * p.steps.length)) : 0;
function totalPct(o){ let s = 0, n = 0; for (const p of D.procs) for (const st of p.steps){ s += lvOf(o, st.id); n++; } return n ? Math.round(100 * s / (4 * n)) : 0; }
function status(p){ const c = CFG(); return p < c.thNew ? {k:'new', n:'Nový', c:'var(--grey)'} : p < c.thOk ? {k:'tr', n:'V tréninku', c:'var(--amber)'} : {k:'ok', n:'Zaškolen', c:'var(--green)'}; }
const pctCol = p => p >= CFG().thOk ? 'var(--green)' : p >= 40 ? 'var(--blue)' : p >= CFG().thNew ? 'var(--amber)' : 'var(--red)';
const opsSorted = () => Object.values(D.ops).filter(o => o && o.name).sort((a,b) => a.name.localeCompare(b.name, 'cs'));
const planKeys = o => [...new Set(String(o.plan || '').split(';').map(x => x.replace(/\(.*?\)/g,'').replace(/\b(12|8) ?cka\b/gi,'').trim()).filter(Boolean))];
const logList = () => Object.entries(D.log || {}).map(([k,v]) => ({k, ...v})).filter(x => x.op && x.at).sort((a,b) => b.at.localeCompare(a.at));
const lastChange = o => Object.values(o.lv || {}).reduce((m, v) => { const t = v?.at || v?.d || ''; return t > m ? t : m; }, '');
const stepById = id => { for (const p of D.procs) for (const s of p.steps) if (s.id === id) return {s, p}; return null; };
function weekStarts(n){ const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return Array.from({length:n}, (_, i) => { const x = new Date(d); x.setDate(x.getDate() - 7 * (n - 1 - i)); return x; }); }
/* průměrné zaškolení týmu ke konci každého týdne – zpětně z dnešního stavu a záznamů změn */
function trend(nWeeks = 12){
  const ops = opsSorted(), steps = allSteps(), n = steps.length; if (!ops.length || !n) return [];
  const ids = new Set(ops.map(o => o.id)), valid = new Set(steps.map(s => s.id));
  const cur = ops.reduce((a,o) => a + Object.entries(o.lv || {}).reduce((b,[sid,v]) => b + (valid.has(sid) ? +v.l || 0 : 0), 0), 0);
  const log = logList().filter(x => ids.has(x.op) && valid.has(x.s));
  return weekStarts(nWeeks).map(ws => { const end = new Date(ws); end.setDate(end.getDate() + 7); const e = end.toISOString();
    const delta = log.filter(x => x.at >= e).reduce((a,x) => a + (+x.l || 0) - (+x.p || 0), 0);
    return { ws, v: Math.max(0, Math.round(100 * (cur - delta) / (4 * n * ops.length))) }; });
}

/* ===================== 5. Grafy (SVG) ===================== */
function ring(p, size = 64, sw = 7, label = '', col){
  const r = (size - sw) / 2, c = 2 * Math.PI * r, h = size / 2;
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${col ? 'rgba(255,255,255,.25)' : 'var(--sq)'}" stroke-width="${sw}"/>
    <circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${col || pctCol(p)}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - Math.min(p,100)/100)}" transform="rotate(-90 ${h} ${h})"/>
    <text class="rt" x="50%" y="${label ? '46%' : '52%'}" text-anchor="middle" dominant-baseline="middle" style="font-size:${Math.round(size/4.4)}px">${p}%</text>${label ? `<text class="rs" x="50%" y="${size > 80 ? 66 : 70}%" text-anchor="middle" style="font-size:${size > 80 ? 10 : 8.5}px">${esc(label)}</text>` : ''}</svg>`;
}
function donut(segs, center, sub){
  const tot = segs.reduce((a,s) => a + s.v, 0) || 1, r = 56, c = 2 * Math.PI * r; let off = 0;
  const arcs = segs.map(s => { const len = c * s.v / tot; const a = `<circle cx="75" cy="75" r="${r}" fill="none" stroke="${s.c}" stroke-width="18" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"/>`; off += len; return a; }).join('');
  return `<div class="donut"><svg width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--sq)" stroke-width="18"/>${arcs}<text class="dc" x="75" y="74" text-anchor="middle">${center}</text><text class="ds" x="75" y="94" text-anchor="middle">${esc(sub)}</text></svg>
    <div class="dl">${segs.map(s => `<div><i style="background:${s.c}"></i><span>${esc(s.l)}</span><b>${s.v}</b><small>${Math.round(100 * s.v / tot)} %</small></div>`).join('')}</div></div>`;
}
function lineChart(pts, {w = 640, h = 190, col = '#0A5FB4', fmt = v => v + ' %', max = 100, bars = false} = {}){
  if (!pts.length) return '<div class="empty">Zatím bez dat.</div>';
  const L = 34, R = 10, T = 12, B = 24, iw = w - L - R, ih = h - T - B, mx = max || Math.max(4, ...pts.map(p => p.v));
  const y = v => T + ih - ih * v / mx, every = Math.ceil(pts.length / 8);
  const grid = [0, .25, .5, .75, 1].map(f => `<line x1="${L}" x2="${w - R}" y1="${y(mx * f)}" y2="${y(mx * f)}" stroke="var(--line)"/><text class="ax" x="${L - 6}" y="${y(mx * f) + 3}" text-anchor="end">${Math.round(mx * f)}</text>`).join('');
  if (bars){ const bw = Math.max(6, iw / pts.length * .6), cx = i => L + (i + .5) * iw / pts.length;
    return `<svg viewBox="0 0 ${w} ${h}">${grid}${pts.map((p,i) => `<rect x="${cx(i) - bw/2}" y="${y(p.v)}" width="${bw}" height="${T + ih - y(p.v)}" rx="3" fill="${col}"><title>${esc(p.l)}: ${fmt(p.v)}</title></rect>`).join('')}${pts.map((p,i) => (i % every === 0 || i === pts.length - 1) ? `<text class="ax" x="${cx(i)}" y="${h - 6}" text-anchor="middle">${esc(p.l)}</text>` : '').join('')}</svg>`; }
  const x = i => L + (pts.length === 1 ? iw / 2 : i * iw / (pts.length - 1));
  const d = pts.map((p,i) => `${i ? 'L' : 'M'}${x(i)},${y(p.v)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}">${grid}<path d="${d} L${x(pts.length-1)},${T+ih} L${x(0)},${T+ih}Z" fill="${col}" opacity=".12"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p,i) => `<circle cx="${x(i)}" cy="${y(p.v)}" r="3.5" fill="#fff" stroke="${col}" stroke-width="2"><title>${esc(p.l)}: ${fmt(p.v)}</title></circle>`).join('')}${pts.map((p,i) => (i % every === 0 || i === pts.length - 1) ? `<text class="ax" x="${x(i)}" y="${h - 6}" text-anchor="middle">${esc(p.l)}</text>` : '').join('')}</svg>`;
}
function radar(vals, size = 300){
  const n = vals.length, cx = size / 2, cy = size / 2, R = size / 2 - 58, pt = (i, f) => [cx + R * f * Math.sin(2 * Math.PI * i / n), cy - R * f * Math.cos(2 * Math.PI * i / n)];
  const rings = [.25,.5,.75,1].map(f => `<polygon points="${vals.map((_,i) => pt(i,f).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`).join('');
  const axes = vals.map((v,i) => { const [x,y] = pt(i,1), [lx,ly] = pt(i,1.3); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/><text class="ax" x="${lx}" y="${ly - 5}" text-anchor="middle">${esc(v.ico)} ${esc(v.l)}</text><text x="${lx}" y="${ly + 9}" text-anchor="middle" style="font-size:11.5px;font-weight:800;fill:${v.c}">${v.v} %</text>`; }).join('');
  const poly = vals.map((v,i) => pt(i, Math.max(.02, v.v / 100)).join(',')).join(' ');
  return `<svg viewBox="0 0 ${size} ${size}" style="max-width:${size + 20}px;margin:auto">${rings}${axes}<polygon points="${poly}" fill="#0A5FB4" fill-opacity=".2" stroke="#0A5FB4" stroke-width="2"/>${vals.map((v,i) => { const [x,y] = pt(i, Math.max(.02, v.v/100)); return `<circle cx="${x}" cy="${y}" r="4.5" fill="${v.c}" stroke="#fff" stroke-width="1.5"/>`; }).join('')}</svg>`;
}
const stack = parts => { const t = parts.reduce((a,p) => a + p.v, 0) || 1; return `<div class="hb">${parts.filter(p => p.v).map(p => `<i style="width:${100 * p.v / t}%;background:${p.c}" title="${esc(p.t)}: ${p.v}">${100 * p.v / t >= 9 ? p.v : ''}</i>`).join('')}</div>`; };
const mbar = (v, col) => `<div class="mb"><div class="tr"><i style="width:${v}%;background:${col}"></i></div><span>${v}%</span></div>`;

/* ===================== 6. Rám: navigace, cesta, záhlaví ===================== */
const route = () => (location.hash.replace(/^#\/?/, '') || 'prehled').split('/').map(decodeURIComponent);
const go = (...p) => { location.hash = '#/' + p.map(encodeURIComponent).join('/'); };
const narrow = () => matchMedia('(max-width:1000px)').matches;
let navOpen = (() => { try{ const v = localStorage.getItem(LS_NAV); return v ? v === '1' && !narrow() : !narrow(); }catch(e){ return !narrow(); } })();
function renderNav(){
  const r = route(), at = (...p) => p.every((x,i) => r[i] === x), ops = opsSorted(), n = ops.length;
  const a = (h, ic, t, on, extra = '') => `<a href="#/${h}" class="${on ? 'on' : ''}"><span class="ic">${ic}</span>${t}${extra}</a>`;
  $('nav').innerHTML = `<div class="g">Přehled</div>
    ${a('prehled','📊','Přehled zaškolení', at('prehled'))}

function filterOps(pre){
  const c = CFG(), q = norm(UI.q);
  return opsSorted().filter(o => {
    const s = status(totalPct(o)).k;
    if (q && !norm(o.name).includes(q)) return false;
    if (UI.tl && (UI.tl === '__none' ? o.tl : o.tl !== UI.tl)) return false;
    if (UI.pl && (UI.pl === '__none' ? planKeys(o).length : !planKeys(o).includes(UI.pl))) return false;
    if (UI.st && s !== UI.st) return false;
    if (pre === 'stale' && !(s === 'tr' && (daysAgo(lastChange(o)) ?? 999) >= c.stale)) return false;
    if (pre === 'bez-trenera' && !(s !== 'ok' && !o.trainer)) return false;
    if (['ok','tr','new'].includes(pre) && s !== pre) return false;
    return true;
  });
}

/* změna úrovně kroku + záznam do historie (jeden zápis) */
async function setLevel(o, sid, l){
  const prev = lvOf(o, sid); if (prev === l) return;
  const at = new Date().toISOString(), val = l ? { l, d: at.slice(0,10), at, ...(ME ? {by: ME} : {}) } : null;
  o.lv ??= {}; if (val) o.lv[sid] = val; else delete o.lv[sid];
  const k = newKey(), entry = { op:o.id, s:sid, l, p:prev, at, by: ME || '' };
  D.log[k] = entry;
  await write({ [`ops/${o.id}/lv/${sid}`]: val, [`log/${k}`]: entry });
}
function bindDetail(o){

  $('cReset').onclick = async () => { if (!confirm(`Vynulovat všechna hodnocení u ${o.name}?`)) return; o.lv = {}; await write({[`ops/${o.id}/lv`]: null}); render(); };
  $('cDel').onclick = async () => { if (!confirm(`Smazat operátora ${o.name} včetně karty?`)) return; delete D.ops[o.id]; await write({[`ops/${o.id}`]: null}); toast('Operátor smazán'); go('operatori'); };
  document.querySelectorAll('#main [data-f]').forEach(i => i.onchange = async () => { o[i.dataset.f] = i.value.trim(); await write({[`ops/${o.id}/${i.dataset.f}`]: o[i.dataset.f] || null}); toast('Uloženo'); });
  document.querySelectorAll('#main .sq').forEach(b => b.onclick = async () => {
    const sid = b.dataset.step, n = +b.dataset.l, cur = lvOf(o, sid), y = scrollY;

  });
}

      <div style="margin-top:10px"><button class="btn" id="thm">🌓 Přepnout světlý / tmavý režim</button></div></div></div>`; }
  return head + sub + `<div class="grid g21"><div class="card"><h3>Import operátorů</h3><div class="in">
      <p class="small" style="margin-top:0">Sloupce: <b>Operátor</b>, <b>Team Leader</b>, <b>Trenér</b>, <b>Nástup</b> (RRRR-MM-DD nebo DD.MM.RRRR), <b>Proces</b> (z rozpisu), <b>Poznámka</b>. Hlavičky se poznají podle názvu, bez hlavičky platí pořadí sloupců. U existujícího operátora se doplní údaje, hodnocení zůstane.</p>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px"><label class="btn f">📄 Nahrát soubor (.xlsx / .csv)<input type="file" id="impFile" accept=".xlsx,.xls,.csv,.txt" hidden></label><button class="btn" id="impTpl">⬇ Šablona CSV</button></div>
      <textarea id="impText" placeholder="…nebo sem vložte tabulku zkopírovanou z Excelu"></textarea>
      <div id="impPrev" style="margin:10px 0"></div>
      <button class="btn f" id="impGo" disabled>Importovat</button></div></div>
    <div class="card"><h3>Export do Excelu</h3><div class="in" style="display:flex;flex-direction:column;gap:8px;align-items:flex-start">
      <button class="btn" id="exD">⬇ Podrobně – každý krok každého operátora</button>
      <button class="btn" id="exM">⬇ Skill matrix – operátor × proces (%)</button>
      <button class="btn" id="exL">⬇ Historie změn</button>
      <p class="small muted" style="margin:0">Soubory .csv se středníkem se otevřou přímo v Excelu.</p></div></div></div>`;
}
const COLS = { name:/^(operator|jmeno|name|prijmeni)/, tl:/^(team ?leader|tl|vedouci)/, trainer:/^(trener|trainer|tr)$/, start:/^(nastup|datum|start)/, note:/^(poznamka|note)/, plan:/^(proces|pracoviste|plan)/ };
function parseDate(s){ s = String(s ?? '').trim(); if (!s) return '';
  if (/^\d{5}$/.test(s)) return new Date(Math.round((+s - 25569) * 864e5)).toISOString().slice(0,10);
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})/); if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; return ''; }
function rowsFromTable(tab){
  tab = tab.map(r => r.map(c => String(c ?? '').trim())).filter(r => r.some(Boolean)); if (!tab.length) return [];
  const h = tab[0].map(norm), idx = {}; for (const [k, re] of Object.entries(COLS)){ const i = h.findIndex(x => re.test(x)); if (i >= 0) idx[k] = i; }
  let body = tab; if (idx.name != null) body = tab.slice(1); else { idx.name = 0; idx.tl = 1; idx.trainer = 2; idx.start = 3; }
  const g = (r, k) => idx[k] != null ? r[idx[k]] || '' : '';
  return body.map(r => ({ name: g(r,'name').replace(/\s+/g,' '), tl: g(r,'tl'), trainer: g(r,'trainer'), start: parseDate(g(r,'start')), note: g(r,'note'), plan: g(r,'plan') })).filter(r => r.name);
}
function parseText(txt){ const lines = txt.replace(/\r/g,'').split('\n').filter(l => l.trim()); if (!lines.length) return [];
  const sep = lines[0].includes('\t') ? '\t' : (lines[0].split(';').length >= lines[0].split(',').length ? ';' : ',');
  return rowsFromTable(lines.map(l => { const out = []; let cur = '', q = false; for (let i = 0; i < l.length; i++){ const c = l[i];
    if (q){ if (c === '"' && l[i+1] === '"'){ cur += '"'; i++; } else if (c === '"') q = false; else cur += c; } else if (c === '"') q = true; else if (c === sep){ out.push(cur); cur = ''; } else cur += c; } out.push(cur); return out; })); }
async function readFile(f){
  if (/\.xlsx?$/i.test(f.name)){ if (!window.XLSX) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const wb = XLSX.read(await f.arrayBuffer(), {type:'array'}), sn = wb.SheetNames.find(n => /import/i.test(n)) || wb.SheetNames[0];
    return rowsFromTable(XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, raw:false, dateNF:'yyyy-mm-dd'})); }
  const buf = await f.arrayBuffer(); let txt = new TextDecoder('utf-8').decode(buf); if (txt.includes('�')) txt = new TextDecoder('windows-1250').decode(buf);
  return parseText(txt.replace(/^﻿/, ''));
}
function showPreview(rows){
  impRows = rows; const byName = new Map(opsSorted().map(o => [norm(o.name), o])), nw = rows.filter(r => !byName.has(norm(r.name))).length;
  $('impPrev').innerHTML = rows.length ? `<div class="banner" style="border-color:var(--blue);background:var(--th);color:var(--navy)"><b>${rows.length}</b> řádků · <b>${nw}</b> nových · <b>${rows.length - nw}</b> se aktualizuje</div>
    <div class="tw" style="max-height:260px"><table><thead><tr><th>Operátor</th><th>Team Leader</th><th>Trenér</th><th>Nástup</th><th>Proces</th><th></th></tr></thead><tbody>${rows.slice(0,300).map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.tl)}</td><td>${esc(r.trainer)}</td><td>${r.start ? dfmt(r.start) : ''}</td><td class="small">${esc(r.plan)}</td><td>${byName.has(norm(r.name)) ? '<span class="pill">aktualizace</span>' : '<span class="pill g">nový</span>'}</td></tr>`).join('')}</tbody></table></div>`
    : '<div class="small muted">V datech nejsou žádní operátoři.</div>';
  $('impGo').disabled = !rows.length;
}
async function doImport(){
  const byName = new Map(opsSorted().map(o => [norm(o.name), o])), upd = {}; let n = 0, u = 0;
  for (const r of impRows){ let o = byName.get(norm(r.name)); const isNew = !o;
    if (isNew){ o = { id: uid(), name: r.name, created: today() }; D.ops[o.id] = o; byName.set(norm(r.name), o); n++; } else u++;
    for (const k of ['tl','trainer','start','note','plan']) if (r[k]){ o[k] = r[k]; if (!isNew) upd[`ops/${o.id}/${k}`] = r[k]; }
    if (isNew) upd[`ops/${o.id}`] = o; }
  await write(upd); impRows = []; toast(`Import hotov: ${n} nových, ${u} aktualizováno`); go('operatori');
}
const csvq = v => { v = String(v ?? ''); return /[;"\n\r]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v; };
function download(rows, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + rows.map(r => r.map(csvq).join(';')).join('\r\n')], {type:'text/csv;charset=utf-8'})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
binds.nastaveni = r => {
  const tab = r[1] || 'import';
  if (tab === 'import'){
    $('impText').oninput = () => showPreview(parseText($('impText').value));
    $('impFile').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; try{ showPreview(await readFile(f)); }catch(err){ console.warn(err); toast('Soubor se nepodařilo přečíst'); } };
    $('impGo').onclick = doImport;
    $('impTpl').onclick = () => download([['Operátor','Team Leader','Trenér','Nástup','Proces','Poznámka']], 'sablona-import-operatoru.csv');
    $('exD').onclick = () => { const rows = [['Operátor','Nástup','Team Leader','Trenér','Proces (rozpis)','Proces','Část','Krok','Úroveň (0–4)','Stav kroku','Datum změny','Zapsal','% procesu','% celkem']];
      for (const o of opsSorted()){ const t = totalPct(o); for (const p of D.procs){ const pp = procPct(o,p); for (const s of p.steps){ const e = o.lv?.[s.id] || {}, l = +(e.l || 0); rows.push([o.name, o.start ? dfmt(o.start) : '', o.tl, o.trainer, o.plan, p.n, s.g || '', s.n, l, LEVELS[l], e.d ? dfmt(e.d) : '', e.by, pp, t]); } } }
      download(rows, `treninkove-karty-podrobne-${today()}.csv`); };
    $('exM').onclick = () => download([['Operátor','Team Leader','Trenér','Proces (rozpis)', ...D.procs.map(p => p.n + ' %'), 'Celkem %', 'Stav'], ...opsSorted().map(o => [o.name, o.tl, o.trainer, o.plan, ...D.procs.map(p => procPct(o,p)), totalPct(o), status(totalPct(o)).n])], `skill-matrix-${today()}.csv`);
    $('exL').onclick = () => download([['Datum','Čas','Operátor','Proces','Krok','Z','Na','Zapsal'], ...logList().filter(x => D.ops[x.op]).map(x => { const sp = stepById(x.s); return [dfmt(x.at), new Date(x.at).toLocaleTimeString('cs-CZ'), D.ops[x.op].name, sp?.p.n || '', sp ? sLabel(sp.s) : '(smazaný krok)', +x.p || 0, +x.l || 0, x.by]; })], `historie-zmen-${today()}.csv`);
  }
  if (tab === 'skilly'){
    const p = D.procs[skProc] || D.procs[0], save = async () => { await write({procs: D.procs}); render(); };
    document.querySelectorAll('[data-sk]').forEach(b => b.onclick = () => { skProc = +b.dataset.sk; render(); });
    $('pN').onchange = e => { if (e.target.value.trim()){ p.n = e.target.value.trim(); save(); } };
    $('pI').onchange = e => { p.ico = e.target.value.trim() || p.ico; save(); };
    $('pC').onchange = e => { p.col = e.target.value; save(); };
    document.querySelectorAll('[data-ren]').forEach(i => i.onchange = () => { if (i.value.trim()){ p.steps[+i.dataset.ren].n = i.value.trim(); save(); } });
    document.querySelectorAll('[data-grp]').forEach(i => i.onchange = () => { const st = p.steps[+i.dataset.grp], g = i.value.trim().toUpperCase(); if (g) st.g = g; else delete st.g; save(); });
    document.querySelectorAll('[data-up]').forEach(b => b.onclick = () => { const i = +b.dataset.up; [p.steps[i-1], p.steps[i]] = [p.steps[i], p.steps[i-1]]; save(); });
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { const s = p.steps[+b.dataset.del]; if (confirm(`Smazat krok „${s.n}“ u procesu ${p.n}?`)){ p.steps.splice(+b.dataset.del, 1); save(); } });
    $('skAdd').onsubmit = e => { e.preventDefault(); const n = $('skNew').value.trim(); if (!n) return; const g = $('skGrp').value.trim().toUpperCase(); p.steps.push({ id: p.k + '_' + uid(), n, ...(g ? {g} : {}) }); save(); };
    $('skReset').onclick = () => { if (confirm('Obnovit výchozí kroky u všech procesů (podle zadání linky)? Vlastní úpravy kroků se ztratí.')){ D.procs = defaultProcs(); save(); } };
  }
  if (tab === 'parametry'){
    document.querySelectorAll('[data-c]').forEach(i => i.onchange = async () => { const v = Math.max(0, Math.min(365, +i.value || 0)); D.cfg = {...CFG(), [i.dataset.c]: v}; await write({cfg: D.cfg}); toast('Uloženo'); });
    $('thm').onclick = () => { const el = document.documentElement, dark = el.dataset.theme ? el.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; el.dataset.theme = dark ? 'light' : 'dark'; try{ localStorage.setItem(LS_THEME, el.dataset.theme); }catch(e){} };
  }
};

/* ===================== 8. Rychlé hledání, jméno, menu ===================== */
let qsHi = 0;
function qsRender(){
  const q = norm($('qs').value), dd = $('qsDd');
  if (!q){ dd.classList.remove('open'); return; }
  const hits = opsSorted().filter(o => norm(o.name).includes(q)).slice(0, 12); qsHi = Math.min(qsHi, Math.max(hits.length - 1, 0));
  dd.innerHTML = hits.map((o,i) => { const t = totalPct(o); return `<a data-id="${esc(o.id)}" class="${i === qsHi ? 'hi' : ''}">${avatar(o.name)}<span><b>${esc(o.name)}</b><small>${esc(o.plan || '')}${o.tl ? ' · TL ' + esc(o.tl) : ''}</small></span><span class="st ${status(t).k}">${t}%</span></a>`; }).join('') || '<div class="none">Nikdo neodpovídá.</div>';
  const r = $('qs').getBoundingClientRect(); dd.style.top = (r.bottom + 6) + 'px'; dd.style.left = Math.max(8, Math.min(r.left, innerWidth - 328)) + 'px'; dd.classList.add('open');
}
const qsPick = id => { $('qs').value = ''; $('qsDd').classList.remove('open'); $('qs').blur(); go('op', id); };
$('qs').oninput = () => { qsHi = 0; qsRender(); };
$('qs').onkeydown = e => { const it = [...$('qsDd').querySelectorAll('a[data-id]')];
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); if (it.length){ qsHi = (qsHi + (e.key === 'ArrowDown' ? 1 : -1) + it.length) % it.length; qsRender(); } }
  else if (e.key === 'Enter'){ e.preventDefault(); if (it[qsHi]) qsPick(it[qsHi].dataset.id); }
  else if (e.key === 'Escape'){ $('qs').value = ''; $('qsDd').classList.remove('open'); } };
$('qsDd').onmousedown = e => { const a = e.target.closest('a[data-id]'); if (a){ e.preventDefault(); qsPick(a.dataset.id); } };
$('qs').onblur = () => setTimeout(() => $('qsDd').classList.remove('open'), 150);
document.addEventListener('keydown', e => { if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)){ e.preventDefault(); $('qs').focus(); } });
function showMe(){ $('whoName').textContent = 'Zapisuje: ' + (ME || '— nastavit jméno'); }
$('who').onclick = () => { const n = prompt('Vaše jméno (trenér / TL) – ukládá se ke každé změně úrovně:', ME); if (n == null) return; ME = n.trim(); try{ localStorage.setItem(LS_ME, ME); }catch(e){} showMe(); toast(ME ? `Změny se zapisují jako ${ME}` : 'Jméno smazáno'); };
$('burger').onclick = () => { navOpen = !navOpen; try{ if (!narrow()) localStorage.setItem(LS_NAV, navOpen ? '1' : '0'); }catch(e){} renderNav(); };
$('shade').onclick = () => { navOpen = false; renderNav(); };
$('nav').onclick = e => { if (narrow() && e.target.closest('a')){ navOpen = false; renderNav(); } };
window.addEventListener('hashchange', () => { render(); scrollTo(0, 0); });

/* ===================== 9. Start ===================== */
(async () => {
  try{ const th = localStorage.getItem(LS_THEME); if (th) document.documentElement.dataset.theme = th; }catch(e){}
  loadLocal(); showMe(); setSync(); render();
  try{ await fbInit(); }catch(e){ console.warn('Firebase', e); fb = null; }
  setSync(); render();
})();
</script>
</body>

<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G463 Prefix – Training system · Yanfeng Planá</title>
<meta name="description" content="Linka G463 Prefix: denní rutina trenéra a tréninkové karty operátorů v jedné aplikaci.">
<meta name="theme-color" content="#002B5C">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Shell podle Plant Management System: navy hlavička, vlevo menu modulů, vpravo modul v rámu podle #hash.
   Na mobilu se menu schová pod tlačítko ☰. */
:root{
  --navy:#003B7A; --navy-d:#002B5C; --blue:#0A5FB4; --bg:#F3F5F8; --card:#fff; --soft:#e8f0fa; --hover:#eef3f9;
  --txt:#1f2933; --muted:#6b7684; --line:#e3e8ed; --chip:#eef2f6; --chip-t:#41525f;
  --green:#1E9E4A; --amber:#E89818; --violet:#6B4FB8;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --hdr:58px; --rail:248px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0E141C;--card:#161E29;--soft:#122A47;--hover:#1B2533;--txt:#E6ECF2;--muted:#93A1B1;--line:#263241;--chip:#1E2A3A;--chip-t:#B8C6D4}
}
:root[data-theme="dark"]{--bg:#0E141C;--card:#161E29;--soft:#122A47;--hover:#1B2533;--txt:#E6ECF2;--muted:#93A1B1;--line:#263241;--chip:#1E2A3A;--chip-t:#B8C6D4}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-top:var(--sat)}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

header{position:fixed;top:0;left:0;right:0;z-index:30;padding-top:var(--sat);background:linear-gradient(90deg,var(--navy-d) 0%,var(--navy) 55%,var(--blue) 100%);color:#fff;border-bottom:3px solid var(--blue)}
.hbar{height:var(--hdr);display:flex;align-items:center;gap:14px;padding:0 18px}
.brand{display:flex;align-items:center;gap:10px;padding-right:14px;border-right:1px solid rgba(255,255,255,.25);text-decoration:none}
.brand .lg{background:#fff;border-radius:7px;padding:5px 9px;display:flex;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.brand img{height:22px;width:auto;display:block}
.brand .bt{display:flex;flex-direction:column;line-height:1.05}
.brand .bt b{font-size:12.5px;font-weight:800;letter-spacing:2px}
.brand .bt small{font-size:10px;letter-spacing:.8px;text-transform:uppercase;opacity:.8;margin-top:3px}
.ttl{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.ttl b{font-size:16px;font-weight:700;white-space:nowrap}
.ttl small{font-size:11.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.pill{background:rgba(255,255,255,.16);border:0;color:#fff;font-family:inherit;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:500;white-space:nowrap;text-decoration:none;cursor:pointer}
.pill:hover{background:rgba(255,255,255,.28)}
.menu-btn{all:unset;display:none;cursor:pointer;width:38px;height:38px;border-radius:9px;align-items:center;justify-content:center;background:rgba(255,255,255,.14)}
.menu-btn svg{width:20px;height:20px}

aside{position:fixed;top:calc(var(--hdr) + 3px + var(--sat));bottom:0;left:0;width:var(--rail);background:var(--card);border-right:1px solid var(--line);overflow-y:auto;padding:14px 10px calc(14px + var(--sab));z-index:20}
.grp{font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;text-decoration:none;color:var(--txt);font-weight:600;font-size:13.5px;min-height:44px}
.nav a:hover{background:var(--hover)}
.nav a.on{background:var(--navy);color:#fff}
.nav a .ic{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--dc,var(--navy)) 13%,var(--card));color:var(--dc,var(--navy));flex:none}
.nav a.on .ic{background:rgba(255,255,255,.18);color:#fff}
.nav a .ic svg{width:16px;height:16px}
.nav a .ext{margin-left:auto;font-size:11px;opacity:.6}
.rail-foot{margin:18px 10px 0;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}

main{position:fixed;top:calc(var(--hdr) + 3px + var(--sat));bottom:0;left:var(--rail);right:0;overflow:hidden}
#frame{width:100%;height:100%;border:0;display:block;background:var(--bg)}
#frame[hidden],#home[hidden]{display:none}
#home{position:absolute;inset:0;overflow-y:auto;background:var(--bg);padding:22px 26px calc(40px + var(--sab))}
.hero{border-radius:14px;padding:26px 28px;color:#fff;background:linear-gradient(110deg,var(--navy-d) 0%,var(--navy) 55%,var(--blue) 100%);box-shadow:0 6px 20px rgba(0,43,92,.18);margin-bottom:20px}
.hero .k{font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.8;font-weight:700}
.hero h1{margin:6px 0 6px;font-size:28px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.hero p{margin:0;max-width:70ch;opacity:.92}
.flow{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.flow span{background:rgba(255,255,255,.14);border-radius:999px;padding:3px 11px;font-size:12px;font-weight:600}
.flow i{font-style:normal;opacity:.7;align-self:center}
h2.sec{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:22px 2px 10px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.tile{background:var(--card);border-radius:10px;box-shadow:0 1px 3px rgba(16,32,48,.08);border-top:3px solid var(--dc,var(--blue));padding:16px 16px 14px;text-decoration:none;display:flex;flex-direction:column;gap:6px;transition:box-shadow .15s,transform .15s}
.tile:hover{box-shadow:0 6px 18px rgba(16,32,48,.12);transform:translateY(-1px)}
.tile .hd{display:flex;align-items:center;gap:10px}
.tile .ic{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--dc,var(--navy)) 13%,var(--card));color:var(--dc,var(--navy))}
.tile .ic svg{width:18px;height:18px}
.tile b{font-size:15px;color:var(--dc,var(--navy))}
.tile p{margin:0;color:var(--muted);font-size:13px}
.tile .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.tile .meta span{font-size:11px;font-weight:600;background:var(--chip);color:var(--chip-t);border-radius:999px;padding:2px 9px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:6px}
.how div{background:var(--card);border-radius:10px;box-shadow:0 1px 3px rgba(16,32,48,.08);padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.how b{color:var(--navy);font-size:14px}
.how span{color:var(--muted);font-size:12.5px}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .how b{color:#9CC3F0} }
:root[data-theme="dark"] .how b{color:#9CC3F0}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,27,58,.45);z-index:15}

@media (max-width:860px){
  :root{--rail:0px}
  .brand .bt,.ttl small,.hide-m{display:none}
  .menu-btn{display:flex}
  .hbar{gap:10px;padding:0 12px}
  aside{width:280px;transform:translateX(-100%);transition:transform .2s;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  body.menu aside{transform:none}
  body.menu .scrim{display:block}
  #home{padding:16px 16px calc(32px + var(--sab))}
  .hero{padding:20px} .hero h1{font-size:23px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <button class="menu-btn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="brand" href="#uvod"><span class="lg"><img src="assets/logo.png" alt="Yanfeng"></span><span class="bt"><b>PLANÁ NAD LUŽNICÍ</b><small>G463 Prefix · Training system</small></span></a>
    <div class="ttl"><b id="modTitle">G463 Prefix</b><small id="modSub">Training system</small></div>
    <div class="sp"></div>
    <a class="pill hide-m" id="openAlone" href="#" target="_blank" rel="noopener" hidden>Otevřít samostatně ↗</a>
  </div>
</header>
<div class="scrim" id="scrim"></div>
<aside id="rail"><nav class="nav" id="nav"></nav><div class="rail-foot">Trenér = co se děje dnes na směně. Tréninkové karty = co už operátor umí. Oba moduly sdílí Firebase projekt linky.</div></aside>
<main>
  <section id="home"></section>
  <iframe id="frame" title="Modul" hidden></iframe>
</main>

<script>
const I = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  shift:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>',
  card:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M6 16c.6-1.6 1.7-2.4 3-2.4s2.4.8 3 2.4M15 9h3M15 13h3"/></svg>',
};
/* Moduly: id = #hash, src = stránka modulu (běží i samostatně), col = barva. Nový modul = nová složka modules/<id>/ + řádek sem. */
const GROUPS = [
  { n: 'Trénink na lince', m: [
    { id: 'trener', t: 'Trenér G463', s: 'Denní rutina trenéra na směně', d: 'Fokus směny podle rozhodovacího diagramu, stav procesů na lince, záznamy pozorování a korekcí, eskalace, briefing TOP vad, předávka směny a přehled pro TL.', src: 'modules/trener/index.html', ic: 'shift', col: '#0A5FB4', tags: ['každou směnu', 'L1 / L2', 'trenér · TL'] },
    { id: 'karty', t: 'Tréninkové karty', s: 'Skilly operátorů po procesech', d: 'Karta každého operátora: Spacer, Glue application, Prefix, Lamination, Edge Wrapping, Rework. Kroky po 4 úrovních, % zaškolení za proces i celkem, import a export do Excelu.', src: 'modules/karty/index.html', ic: 'card', col: '#1E9E4A', tags: ['průběžně', 'trenér · TL'] }
  ]}
];
const ALL = GROUPS.flatMap(g => g.m.map(m => Object.assign({ g: g.n }, m)));
const $ = id => document.getElementById(id);
const icHtml = m => '<span class="ic"' + (m.col ? ' style="--dc:' + m.col + '"' : '') + '>' + I[m.ic] + '</span>';

function navHtml(cur){
  let h = '<a href="#uvod" class="' + (cur === 'uvod' ? 'on' : '') + '"><span class="ic">' + I.home + '</span>Úvod</a>';
  GROUPS.forEach(g => {
    h += '<div class="grp">' + g.n + '</div>';
    g.m.forEach(m => {
      h += m.href
        ? '<a href="' + m.href + '" target="_blank" rel="noopener">' + icHtml(m) + m.t + '<span class="ext">↗</span></a>'
        : '<a href="#' + m.id + '" class="' + (cur === m.id ? 'on' : '') + '">' + icHtml(m) + m.t + '</a>';
    });
  });
  return h;
}
function tileHtml(m){
  return '<a class="tile" href="' + (m.href || '#' + m.id) + '"' + (m.href ? ' target="_blank" rel="noopener"' : '') + ' style="--dc:' + m.col + '"><div class="hd">' + icHtml(m) + '<b>' + m.t + (m.href ? ' ↗' : '') + '</b></div><p>' + m.d + '</p>' +
    '<div class="meta">' + m.tags.map(t => '<span>' + t + '</span>').join('') + '</div></a>';
}
function homeHtml(){
  let h = '<div class="hero"><div class="k">Yanfeng Planá · linka G463 Prefix</div><h1>Training system</h1><p>Jedna aplikace pro trenéry a Team Leadery linky Prefix. Na směně trenér pozoruje a opravuje, na kartě operátora se ukládá, co už umí samostatně.</p>' +
    '<div class="flow"><span>fokus směny</span><i>→</i><span>pozorování</span><i>→</i><span>korekce</span><i>→</i><span>karta operátora</span><i>→</i><span>zaškolen</span></div></div>';
  h += '<div class="how">' +
    '<div><b>Trenér na směně</b><span>Začne v modulu Trenér G463: vybere sebe, směnu a linku, aplikace ho provede rutinou.</span></div>' +
    '<div><b>Postup operátora</b><span>V Tréninkových kartách zapíše úroveň u kroku procesu. Procenta se sečtou sama.</span></div>' +
    '<div><b>Team Leader</b><span>Přehled TL v Trenérovi a přehled týmu v kartách: kdo je na čem zaškolený.</span></div></div>';
  GROUPS.forEach(g => { h += '<h2 class="sec">' + g.n + '</h2><div class="tiles">' + g.m.map(tileHtml).join('') + '</div>'; });
  return h;
}
function route(){
  const id = (location.hash || '#uvod').slice(1), m = ALL.find(x => x.id === id && !x.href);
  $('nav').innerHTML = navHtml(m ? id : 'uvod');
  document.body.classList.remove('menu');
  const fr = $('frame'), oa = $('openAlone');
  if (m){
    $('modTitle').textContent = m.t; $('modSub').textContent = m.g + ' · ' + m.s;
    $('home').hidden = true; fr.hidden = false;
    if (fr.getAttribute('src') !== m.src) fr.setAttribute('src', m.src);
    oa.href = m.src; oa.hidden = false;
    document.title = m.t + ' – G463 Prefix';
  } else {
    $('modTitle').textContent = 'G463 Prefix'; $('modSub').textContent = 'Training system';
    fr.hidden = true; $('home').hidden = false; $('home').innerHTML = homeHtml(); oa.hidden = true;
    document.title = 'G463 Prefix – Training system · Yanfeng Planá';
  }
}
try { const th = localStorage.getItem('trenerG463.theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
$('menuBtn').addEventListener('click', () => document.body.classList.toggle('menu'));
$('scrim').addEventListener('click', () => document.body.classList.remove('menu'));
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
